name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  lint:
    name: Lint (oxlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run oxlint
        run: pnpm run lint

  format:
    name: Format Check (oxfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run oxfmt
        run: pnpm run format:check

  typecheck:
    name: Type Check (oxlint --type-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run oxlint type-check
        run: pnpm run typecheck

  build:
    name: Build (tsdown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test CLI help
        run: node dist/index.mjs --help

      - name: Test CLI dry run
        # init はテンプレートの既定ブランチを GitHub API へ問い合わせる。未認証だと
        # 60 req/h をランナーの共有 IP で使い切り、コードと無関係に落ちる。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/test-project
          node dist/index.mjs /tmp/test-project --yes
          ls -la /tmp/test-project
          cat /tmp/test-project/.ziku/ziku.jsonc
          cat /tmp/test-project/.ziku/lock.json

  test:
    name: Test (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test:run

  diff-coverage:
    name: Diff Coverage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: Check diff coverage
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm tsx scripts/diff-coverage.ts --threshold 80 --base "origin/$BASE_REF"

  docs:
    name: Check README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check README is up to date
        run: pnpm run docs:check

  release-dry-run:
    name: Release Dry Run
    runs-on: ubuntu-latest
    # changeset version 経由の @changesets/changelog-github が GitHub API 呼び出しで
    # ハングすると、タイムアウトが無いためジョブが無期限に張り付く（実際に約80分ハングした
    # 事例を確認済み）。job 全体に上限を設け、無応答時は失敗として気づけるようにする。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dry-run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! ls .changeset/*.md 2>/dev/null | grep -qv README.md; then
            echo "No changesets found, skipping release dry-run"
            exit 0
          fi
          pnpm run version

      - name: Dry-run publish
        run: |
          pnpm run build
          pnpm pack
